version: "3.9"
services:
  api:
    build: .
    image: ecoomni-api:dev
    container_name: ecoomni-api
    environment:
      - DATABASE_URL=sqlite:////app/app.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
    ports:
      - "8001:8000"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ecoomni-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:


services:
  api:
    build: .
    image: ecoomni-api:dev
    container_name: ecoomni-api
    environment:
      - DATABASE_URL=postgresql://ecoomni_user:ecoomni_pass@postgres:5432/ecoomni_db
      - SECRET_KEY=docker-test-secret-key-change-in-production
    ports:
      - "8001:8000"
    depends_on:
      - postgres
    command: sh -c "sleep 5 && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  postgres:
    image: postgres:15-alpine
    container_name: ecoomni-postgres
    environment:
      - POSTGRES_USER=ecoomni_user
      - POSTGRES_PASSWORD=ecoomni_pass
      - POSTGRES_DB=ecoomni_db
    ports:
      - "5433:5432"  # Use different port to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

